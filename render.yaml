# File: render.yaml
#
# مخطط نشر جاهز (Render Blueprint) للنسخة التجريبية: قاعدة بيانات
# PostgreSQL + خدمة Backend (Docker) + موقع Frontend ثابت (Static Site).
# استخدمه عبر "New +" → "Blueprint" في Render، بعد ربط هذا المستودع.
# القيم المعلَّمة sync: false يجب إدخالها يدوياً من لوحة تحكم Render
# بعد إنشاء الخدمات (أسرار حقيقية، لا تُكتب هنا أبداً).

databases:
  - name: paradise-db
    plan: free
    databaseName: wakalat_paradise
    user: paradise_user

services:
  - type: web
    name: paradise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /docs
    dockerCommand: >-
      sh -c "alembic upgrade head &&
             python -m scripts.seed_initial_data &&
             python -m scripts.seed_agency_services &&
             python -m scripts.seed_service_requirements &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paradise-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SIGNED_URL_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: SIGNED_URL_EXPIRE_SECONDS
        value: "600"
      - key: LOCAL_STORAGE_PATH
        value: storage/private
      - key: CORS_ORIGINS
        value: '["https://paradise-frontend.onrender.com"]'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DUFFEL_API_KEY
        sync: false
      - key: DUFFEL_BASE_URL
        value: https://api.duffel.com
      - key: DUFFEL_VERSION
        value: v2
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: paradise-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paradise-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
